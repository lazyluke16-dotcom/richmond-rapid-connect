name: Inspect isolated staging access

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/staging-access-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-staging-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: staging

    env:
      CERTIFICATION_BASE_URL: ${{ vars.CERTIFICATION_BASE_URL }}
      CERTIFICATION_STAGING_HOSTNAME: ${{ vars.CERTIFICATION_STAGING_HOSTNAME }}
      CLOUDFLARE_STAGING_WORKER_NAME: ${{ vars.CLOUDFLARE_STAGING_WORKER_NAME }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
      VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
      VAPI_SERVER_SECRET: ${{ secrets.VAPI_SERVER_SECRET }}
      VAPI_SERVER_CREDENTIAL_ID: ${{ secrets.VAPI_SERVER_CREDENTIAL_ID }}
      VAPI_SIP_AUTH_USERNAME: ${{ secrets.VAPI_SIP_AUTH_USERNAME }}
      VAPI_SIP_AUTH_PASSWORD: ${{ secrets.VAPI_SIP_AUTH_PASSWORD }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_SMS_GST_TAX_RATE_ID: ${{ secrets.STRIPE_SMS_GST_TAX_RATE_ID }}
      STRIPE_GST_INCLUSIVE_TAX_RATE_ID: ${{ secrets.STRIPE_GST_INCLUSIVE_TAX_RATE_ID }}
      STRIPE_PRICE_MCR_BASE: ${{ secrets.STRIPE_PRICE_MCR_BASE }}
      STRIPE_PRICE_AIR_BASE: ${{ secrets.STRIPE_PRICE_AIR_BASE }}
      STRIPE_PRICE_AIR_USAGE: ${{ secrets.STRIPE_PRICE_AIR_USAGE }}
      STRIPE_COUPON_UNION_FIRST_PLATFORM_FEE: ${{ secrets.STRIPE_COUPON_UNION_FIRST_PLATFORM_FEE }}
      STRIPE_COUPON_FOUNDING_THREE_MONTH_PLATFORM_FEES: ${{ secrets.STRIPE_COUPON_FOUNDING_THREE_MONTH_PLATFORM_FEES }}
      SMS_INVOICE_PROCESSOR_KEY: ${{ secrets.SMS_INVOICE_PROCESSOR_KEY }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      DASHBOARD_PIN: ${{ secrets.DASHBOARD_PIN }}

    steps:
      - name: Inventory configured names without revealing values
        shell: bash
        run: |
          node <<'NODE'
          const { appendFileSync, writeFileSync } = require("node:fs");

          const variableNames = [
            "CERTIFICATION_BASE_URL",
            "CERTIFICATION_STAGING_HOSTNAME",
            "CLOUDFLARE_STAGING_WORKER_NAME",
            "STAGING_SUPABASE_PROJECT_REF",
            "STAGING_SUPABASE_URL",
          ];
          const secretNames = [
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_API_TOKEN",
            "SUPABASE_ACCESS_TOKEN",
            "STAGING_SUPABASE_DB_PASSWORD",
            "STAGING_SUPABASE_SERVICE_ROLE_KEY",
            "STAGING_SUPABASE_PUBLISHABLE_KEY",
            "TWILIO_ACCOUNT_SID",
            "TWILIO_AUTH_TOKEN",
            "TWILIO_FROM_NUMBER",
            "VAPI_API_KEY",
            "VAPI_SERVER_SECRET",
            "VAPI_SIP_AUTH_USERNAME",
            "VAPI_SIP_AUTH_PASSWORD",
            "STRIPE_SECRET_KEY",
            "STRIPE_WEBHOOK_SECRET",
            "STRIPE_SMS_GST_TAX_RATE_ID",
            "STRIPE_GST_INCLUSIVE_TAX_RATE_ID",
            "STRIPE_PRICE_MCR_BASE",
            "STRIPE_PRICE_AIR_BASE",
            "STRIPE_PRICE_AIR_USAGE",
            "STRIPE_COUPON_UNION_FIRST_PLATFORM_FEE",
            "STRIPE_COUPON_FOUNDING_THREE_MONTH_PLATFORM_FEES",
            "SMS_INVOICE_PROCESSOR_KEY",
            "WEBHOOK_SECRET",
            "DASHBOARD_PIN",
          ];
          // Optional/recoverable: the runtime contract in
          // src/lib/vapi.server.ts resolveVapiServerCredentialId() recovers the
          // Vapi server credential id from the existing receptionist assistant
          // (or by matching the Smart Answer server URL) when this secret is
          // absent. It therefore MUST NOT block staging readiness. It is
          // reported for visibility only.
          const optionalRecoverableSecretNames = ["VAPI_SERVER_CREDENTIAL_ID"];

          const missingVariables = variableNames.filter((name) => !process.env[name]?.trim());
          const missingSecrets = secretNames.filter((name) => !process.env[name]?.trim());
          const optionalSecretsNotConfigured = optionalRecoverableSecretNames.filter(
            (name) => !process.env[name]?.trim(),
          );
          const report = {
            target: "staging",
            ready: missingVariables.length === 0 && missingSecrets.length === 0,
            configuredVariableCount: variableNames.length - missingVariables.length,
            requiredVariableCount: variableNames.length,
            configuredSecretCount: secretNames.length - missingSecrets.length,
            requiredSecretCount: secretNames.length,
            missingVariables,
            missingSecrets,
            optionalRecoverableSecretNames,
            optionalSecretsNotConfigured,
            optionalSecretsNote:
              "VAPI_SERVER_CREDENTIAL_ID is recovered at provisioning time when unset; not required for readiness.",
            valuesInspected: false,
          };

          writeFileSync("staging-access-inventory.json", `${JSON.stringify(report, null, 2)}\n`, {
            mode: 0o600,
          });

          const summary = [
            "# Isolated staging access inventory",
            "",
            `Ready: **${report.ready ? "yes" : "no"}**`,
            `Configured variables: **${report.configuredVariableCount}/${report.requiredVariableCount}**`,
            `Configured secrets: **${report.configuredSecretCount}/${report.requiredSecretCount}**`,
            "",
            "## Missing variables",
            "",
            ...(missingVariables.length ? missingVariables.map((name) => `- \`${name}\``) : ["- None"]),
            "",
            "## Missing required secrets",
            "",
            ...(missingSecrets.length ? missingSecrets.map((name) => `- \`${name}\``) : ["- None"]),
            "",
            "## Optional / recoverable credentials (do not block readiness)",
            "",
            ...(optionalSecretsNotConfigured.length
              ? optionalSecretsNotConfigured.map(
                  (name) => `- \`${name}\` — not set; recovered from the existing Vapi assistant at provisioning time`,
                )
              : optionalRecoverableSecretNames.map((name) => `- \`${name}\` — configured`)),
            "",
            "No credential values were printed, stored in the report, or transmitted elsewhere.",
          ].join("\n");
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          console.log(
            JSON.stringify({
              ready: report.ready,
              configuredVariableCount: report.configuredVariableCount,
              requiredVariableCount: report.requiredVariableCount,
              configuredSecretCount: report.configuredSecretCount,
              requiredSecretCount: report.requiredSecretCount,
              missingVariables,
              missingSecrets,
              optionalSecretsNotConfigured,
              valuesPrinted: false,
            }),
          );
          NODE

      - name: Upload non-secret access inventory
        uses: actions/upload-artifact@v4
        with:
          name: staging-access-inventory
          path: staging-access-inventory.json
          if-no-files-found: error
          retention-days: 7
