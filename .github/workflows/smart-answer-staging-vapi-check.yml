name: Smart Answer staging Vapi readiness check

# READ-ONLY probe of staging Vapi reachability and server-credential
# resolvability. Determines whether the standard AI receptionist can be
# provisioned (which requires resolveVapiServerCredentialId to succeed).
# No mutations; prints no secret values.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  vapi-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: staging

    env:
      CERTIFICATION_BASE_URL: ${{ vars.CERTIFICATION_BASE_URL }}
      VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
      VAPI_SERVER_CREDENTIAL_ID: ${{ secrets.VAPI_SERVER_CREDENTIAL_ID }}

    steps:
      - name: Read-only Vapi readiness probe
        shell: bash
        run: |
          node <<'NODE'
          const { writeFileSync, appendFileSync } = require("node:fs");

          void (async () => {
          const BASE = process.env.VAPI_API_BASE || "https://api.vapi.ai";
          const KEY_RAW = process.env.VAPI_API_KEY || "";
          const KEY_TRIMMED = KEY_RAW.replace(/^\uFEFF/, "").trim();
          const keyNeededTrimming = KEY_RAW !== KEY_TRIMMED;
          const CRED_ENV = (process.env.VAPI_SERVER_CREDENTIAL_ID || "").trim();
          const certBase = (process.env.CERTIFICATION_BASE_URL || "").replace(/\/$/, "");
          const standardServerUrl = certBase ? `${certBase}/api/public/webhooks/vapi-inbound` : "";

          async function probeKey(key) {
            if (!key) return { status: null, ok: false, assistants: [], error: "empty key" };
            try {
              const res = await fetch(`${BASE}/assistant`, {
                headers: { Authorization: `Bearer ${key}`, "Content-Type": "application/json" },
              });
              if (res.ok) {
                const body = await res.json();
                return {
                  status: res.status,
                  ok: true,
                  assistants: Array.isArray(body) ? body : [],
                  error: null,
                };
              }
              return { status: res.status, ok: false, assistants: [], error: `HTTP ${res.status}` };
            } catch (e) {
              // Never echo the Authorization header (which contains the key).
              let m = String(e && e.message ? e.message : e);
              if (key) m = m.split(key).join("[REDACTED_KEY]");
              m = m.replace(/Bearer[\s\S]*/i, "Bearer [REDACTED]");
              return { status: null, ok: false, assistants: [], error: m.slice(0, 160) };
            }
          }

          const trimmed = await probeKey(KEY_TRIMMED);
          const raw = keyNeededTrimming ? await probeKey(KEY_RAW) : trimmed;
          const assistants = trimmed.ok ? trimmed.assistants : raw.ok ? raw.assistants : [];
          const httpStatus = raw.status;
          const error = raw.ok ? null : raw.error || trimmed.error;

          const withServerCred = assistants.filter((a) => {
            const s = a && a.server;
            return s && typeof s.credentialId === "string" && s.credentialId.trim();
          });
          const matchingStandardUrl = withServerCred.filter(
            (a) => a.server && a.server.url === standardServerUrl,
          );

          const keyWorks = raw.ok;
          const workingKey = trimmed.ok ? KEY_TRIMMED : raw.ok ? KEY_RAW : null;

          // Vapi requires server.credentialId to be a UUID that exists in the
          // account. Validate the configured id without ever printing it.
          const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
          const credentialIdIsUuid = UUID_RE.test(CRED_ENV);
          let credentialExistsInAccount = false;
          if (workingKey && credentialIdIsUuid) {
            try {
              const res = await fetch(`${BASE}/credential`, {
                headers: { Authorization: `Bearer ${workingKey}` },
              });
              if (res.ok) {
                const creds = await res.json();
                credentialExistsInAccount =
                  Array.isArray(creds) && creds.some((c) => c && c.id === CRED_ENV);
              }
            } catch {
              credentialExistsInAccount = false;
            }
          }
          const configuredCredentialUsable =
            Boolean(CRED_ENV) && credentialIdIsUuid && credentialExistsInAccount;
          const credentialResolvable =
            configuredCredentialUsable || matchingStandardUrl.length > 0;

          const report = {
            vapiKeyWorks: keyWorks,
            vapiKeyWorksTrimmed: trimmed.ok,
            keyNeededTrimming,
            httpStatus,
            assistantCount: assistants.length,
            serverCredentialEnvSet: Boolean(CRED_ENV),
            credentialIdIsUuid,
            credentialExistsInAccount,
            configuredCredentialUsable,
            assistantsWithServerCredential: withServerCred.length,
            assistantsMatchingStandardStagingWebhook: matchingStandardUrl.length,
            standardServerUrlPresent: Boolean(standardServerUrl),
            standardProvisioningCredentialResolvable: credentialResolvable,
            error,
            valuesPrinted: false,
          };
          writeFileSync("smart-answer-staging-vapi-check.json", `${JSON.stringify(report, null, 2)}\n`, {
            mode: 0o600,
          });

          const summary = [
            "# Smart Answer staging Vapi readiness",
            "",
            `Vapi key works (HTTP 200): **${report.vapiKeyWorks}** (status ${httpStatus})`,
            `Assistants in account: **${report.assistantCount}**`,
            `VAPI_SERVER_CREDENTIAL_ID set: **${report.serverCredentialEnvSet}**`,
            `Assistants with a server credential: **${report.assistantsWithServerCredential}**`,
            `Assistants matching the standard staging webhook: **${report.assistantsMatchingStandardStagingWebhook}**`,
            "",
            `Standard receptionist credential resolvable: **${report.standardProvisioningCredentialResolvable}**`,
            error ? `\nError: \`${error}\`` : "",
            "",
            "No secret values were printed. No mutations were performed.",
          ].join("\n");
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          console.log(JSON.stringify(report));
          })().catch((e) => {
            console.error("vapi check failed:", e && e.message ? e.message : e);
            process.exit(1);
          });
          NODE

      - name: Upload sanitised Vapi readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-answer-staging-vapi-check
          path: smart-answer-staging-vapi-check.json
          if-no-files-found: error
          retention-days: 7
